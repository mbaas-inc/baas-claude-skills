name: sdk-cd

# SDK 채널 CD (브랜치 기반 — next→v1 승격 파이프라인):
#   - stage push → 개발 채널(+ 불변 /<version>/) 배포        → dev E2E 검증용
#   - main  push → 운영 채널로 승격(검증된 /<version>/ 복사, 재빌드 없음) → 프로덕션 반영
#
# 채널은 메이저로 나뉜다 — 1.x 는 next·v1, 2.x 는 next-v2·v2. 2.0 은 고정 기능 표면을 뺀 판이라
# 1.x 별칭을 덮으면 그 표면을 쓰는 앱이 깨진다. 어느 앱이 어느 메이저를 받을지는 AI Studio 가
# 앱 소스 표면으로 정한다(mBaas_AI_Studio `baas_sdk_contract.BAAS_SDK_MAJOR_CHANNELS`).
#
# 버전 출처: sdk/package.json 의 version. 승격은 stage 에서 배포된 그 불변 산출물을
# 그대로 v1 으로 복사하므로 "검증한 것 == 배포되는 것"이 보장된다.
# 태그 기반 수동 릴리스는 sdk-release.yml 이 담당(핫픽스/롤백용으로 유지).
on:
  push:
    branches: [stage, main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-cd.yml"

jobs:
  # stage: 새 SDK 를 개발 채널 + 불변 /<version>/ 로 배포 (운영 채널은 건드리지 않음)
  staging:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC AssumeRole
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive version and channels (sdk/package.json)
        id: v
        run: |
          version="$(node -p "require('./sdk/package.json').version")"
          major="${version%%.*}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${major}" = "1" ]; then
            echo "development=next" >> "$GITHUB_OUTPUT"
            echo "production=v1" >> "$GITHUB_OUTPUT"
          else
            echo "development=next-v${major}" >> "$GITHUB_OUTPUT"
            echo "production=v${major}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build + verify
        working-directory: sdk
        run: |
          npm install
          npm run typecheck
          SDK_VERSION="${{ steps.v.outputs.version }}" npm run build
          npm test
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SDK_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Deploy to development channel (+ immutable version)
        working-directory: sdk
        env:
          SDK_VERSION: ${{ steps.v.outputs.version }}
          SDK_CHANNEL: ${{ steps.v.outputs.development }}   # 운영 채널이 아닌 개발 채널 — 프로덕션 격리
          SDK_S3_BUCKET: ${{ vars.SDK_S3_BUCKET }}
          SDK_S3_PREFIX: ${{ vars.SDK_S3_PREFIX }}
          SDK_CF_DISTRIBUTION: ${{ vars.SDK_CF_DISTRIBUTION }}
        run: npm run deploy

  # main: 검증된 불변 /<version>/ 를 운영 채널로 승격 (재빌드 없음)
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive version and channel (sdk/package.json)
        id: v
        run: |
          version="$(node -p "require('./sdk/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "production=v${version%%.*}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SDK_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Promote version to production channel
        working-directory: sdk
        env:
          SDK_VERSION: ${{ steps.v.outputs.version }}
          SDK_CHANNEL: ${{ steps.v.outputs.production }}
          SDK_S3_BUCKET: ${{ vars.SDK_S3_BUCKET }}
          SDK_S3_PREFIX: ${{ vars.SDK_S3_PREFIX }}
          SDK_CF_DISTRIBUTION: ${{ vars.SDK_CF_DISTRIBUTION }}
        run: npm run promote
